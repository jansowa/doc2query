# @package _global_
# Frozen-dev records are supplied by scripts/run_d01_postprocess.py; this config
# does not authorize reading the legacy flattened doc2query_dev.parquet panel.
defaults:
  - d01_4_5b_style_50k_s42
  - _self_

run:
  experiment_id: D01-4.5B-STYLE-DEV-GENERATION-S42
  output_dir: runs/D01-4.5B-STYLE-DEV-GENERATION-S42

data:
  # Required by AppConfig; the frozen-dev runner never reads this placeholder.
  input_path: data/input.jsonl
  input_format: jsonl
  eval_path: null
  max_train_examples: null
  max_eval_examples: null

generation:
  do_sample: true
  temperature: 0.8
  top_p: 0.95
