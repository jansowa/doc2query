# @package _global_
# Uncontrolled K=4 matched baseline for D01-1.5B; frozen dev comes from the CLI.
defaults:
  - w05_1_5b_50k_8gb
  - _self_

run:
  experiment_id: D01-W05-MATCHED-DEV-GENERATION-S42
  output_dir: runs/D01-W05-MATCHED-DEV-GENERATION-S42

data:
  # Schema placeholder only; frozen records are supplied by the runner.
  input_path: data/input.jsonl
  input_format: jsonl
  eval_path: null
  max_train_examples: null
  max_eval_examples: null

generation:
  controlled: false
  target_query_count: 4
  do_sample: true
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 64
