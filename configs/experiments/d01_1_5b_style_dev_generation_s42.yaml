# @package _global_
# Post-training generation is loaded directly from the frozen Task 04 manifest
# by scripts/run_d01_postprocess.py. data.input_path is intentionally unused.
defaults:
  - d01_1_5b_style_50k_s42
  - _self_

run:
  experiment_id: D01-1.5B-STYLE-DEV-GENERATION-S42
  output_dir: runs/D01-1.5B-STYLE-DEV-GENERATION-S42

data:
  # Required by AppConfig; the frozen-dev runner never reads this placeholder.
  input_path: data/input.jsonl
  input_format: jsonl
  eval_path: null
  max_train_examples: null
  max_eval_examples: null

generation:
  do_sample: true
  temperature: 0.8
  top_p: 0.95
