# @package _global_
defaults:
  - /data: default
  - /model: bielik_1_5b_base_or_instruct
  - /train@training: qlora_16gb
  - /generation: default
  - _self_
run:
  experiment_id: S00
  seed: 42
  output_dir: runs/S00
data:
  # Model loading only. The S00 runner ignores this selector and fail-closes on
  # the derived 5k cohort from the frozen Task 04 development manifest.
  input_path: data/processed/v1/dev.parquet
  input_format: parquet
  train_split: train
  eval_split: dev
  max_eval_examples: 5000
training:
  baseline: b1
tracking: {backend: offline, online: false}
