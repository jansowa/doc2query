  focus_mode: bucket
  length: medium
  intent_applicable: unset
  max_characters_per_query: 320
  single_line: true

controls:
  - {control_id: c0, form: full_question, intent: fact_lookup, focus_bucket: beginning}
  - {control_id: c1, form: keyword_query, intent: definition, focus_bucket: middle}
  - {control_id: c2, form: full_question, intent: procedure, focus_bucket: end}
  - {control_id: c3, form: keyword_query, intent: entity_lookup, focus_bucket: middle}

generation:
  controls_per_passage: 4
  candidates_per_control: 4
  expected_record_count: 9600
  shard_dir: artifacts/task06/teacher_claude_v1/shards
  shard_size: 25
  shard_count: 24
  merged: artifacts/task06/teacher_claude_v1/candidates.jsonl
  decoding: not_applicable_api_teacher
  temperature: not_applicable_api_teacher
  top_p: not_applicable_api_teacher
  seed: not_applicable_api_teacher
  token_logprobs: not_applicable_api_teacher
  sequence_logprob: not_applicable_api_teacher
  diversity_by: authored_intent_not_sampling

record_schema:
  required:
    - cluster_id
    - example_id
    - order_index
    - control_id
    - form
    - intent
    - focus_bucket
    - candidate_index
    - query
    - author_model
  query_constraints:
    single_line: true
    non_empty: true
    max_characters: 320
    distinct_within_control: true

diversity_gate:
  applies_to_teacher: false
